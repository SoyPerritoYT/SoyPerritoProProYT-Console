<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoyPerritoProProYT-Console</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080808; color: white; font-family: Arial, sans-serif; text-align: center; }
    #inicio { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 25px; }
    #inicio h1 { font-size: clamp(28px, 6vw, 52px); }
    #consola { display: none; min-height: 100vh; padding: 25px; }
    #menu { max-width: 900px; margin: 30px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    button { padding: 18px 25px; font-size: 20px; font-weight: bold; border: 0; border-radius: 15px; cursor: pointer; }
    #encender { background: #20d866; color: white; }
    .menu-btn { background: #202020; color: white; border: 1px solid #444; }
    .menu-btn:hover, #encender:hover { filter: brightness(1.2); }
    #estado { margin-top: 25px; color: #aaa; }
  </style>
</head>
<body>
  <div id="inicio">
    <h1>🐶 SoyPerritoProProYT-Console</h1>
    <button id="encender" type="button">⚡ ENCENDER</button>
  </div>
  <main id="consola">
    <h1>🎮 ¡Consola encendida!</h1>
    <p>🐶 SoyPerritoProProYT-Console funciona.</p>
    <section id="menu">
      <button class="menu-btn" id="shopBtn" type="button">🛒 SHOP</button>
      <button class="menu-btn" type="button" data-name="Mis juegos">🎮 Mis juegos</button>
      <button class="menu-btn" type="button" data-name="Perfil">👤 Perfil</button>
      <button class="menu-btn" type="button" data-name="Ajustes">⚙️ Ajustes</button>
    </section>
    <p id="estado">Selecciona una opción del menú.</p>
  </main>
  <script>
    const inicio = document.getElementById('inicio');
    const consola = document.getElementById('consola');
    const encender = document.getElementById('encender');
    const shopBtn = document.getElementById('shopBtn');
    const estado = document.getElementById('estado');

    encender.addEventListener('click', () => {
      inicio.style.display = 'none';
      consola.style.display = 'block';
      estado.textContent = '✅ Consola iniciada correctamente.';
    });

    shopBtn.addEventListener('click', () => {
      window.location.href = 'shop.html';
    });

    document.querySelectorAll('.menu-btn:not(#shopBtn)').forEach((boton) => {
      boton.addEventListener('click', () => {
        estado.textContent = 'Has seleccionado: ' + boton.dataset.name;
      });
    });
  </script>
</body>
</html>
