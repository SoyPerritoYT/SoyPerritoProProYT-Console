<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoyPerritoProProYT-Console</title>

  <style>
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #inicio {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #consola {
      display: none;
      padding: 30px;
    }

    button {
      padding: 18px 30px;
      font-size: 20px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
    }

    #encender {
      background: #20d866;
      color: white;
    }
  </style>
</head>

<body>

  <div id="inicio">
    <h1>🐶 SoyPerritoProProYT-Console</h1>

    <button id="encender">
      ⚡ ENCENDER
    </button>
  </div>

  <div id="consola">
    <h1>🎮 ¡Consola encendida!</h1>
    <p>🐶 SoyPerritoProProYT-Console funciona.</p>
  </div>

  <script>
    document.getElementById("encender").addEventListener("click", function () {
      document.getElementById("inicio").style.display = "none";
      document.getElementById("consola").style.display = "block";
    });
  </script>

</body>
</html>
