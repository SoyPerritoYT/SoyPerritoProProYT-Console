<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐶 SoyPerrito Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px}main{max-width:700px;margin:auto}h1{font-size:clamp(30px,8vw,55px)}.game{background:#181818;border:1px solid #444;border-radius:20px;padding:25px;margin-top:20px}.dog{font-size:90px;margin:15px}.stats{font-size:20px;margin:15px}.action{padding:16px 25px;border:0;border-radius:14px;background:#20d866;color:#fff;font-size:20px;font-weight:bold;cursor:pointer;margin:6px}.back{background:#333}.message{min-height:30px;color:#aaa;font-size:18px}</style>
</head>
<body>
<main>
<h1>🐶 SoyPerrito Adventure</h1>
<p>🎮 Juego oficial de SoyPerritoProProYT</p>
<div class="game">
<div class="dog">🐶</div>
<div class="stats">⭐ Puntos: <span id="puntos">0</span></div>
<p class="message" id="mensaje">¡Pulsa EXPLORAR para empezar!</p>
<button class="action" id="explorar">🌳 EXPLORAR</button>
<button class="action back" onclick="location.href='../shop.html'">⬅️ SHOP</button>
</div>
</main>
<script>
let puntos=0;
const puntosEl=document.getElementById('puntos');
const mensaje=document.getElementById('mensaje');
const eventos=['🐾 Has encontrado una huella misteriosa.','🦴 ¡Encontraste un hueso!','⭐ ¡Has descubierto una estrella!','🌳 Has explorado el bosque.','🎮 ¡Nueva aventura desbloqueada!'];
document.getElementById('explorar').addEventListener('click',()=>{puntos+=10;puntosEl.textContent=puntos;mensaje.textContent=eventos[Math.floor(Math.random()*eventos.length)]+' +10 puntos';});
</script>
</body>
</html>
