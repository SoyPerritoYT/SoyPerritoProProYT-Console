<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🐶 SoyPerrito Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:14px;touch-action:manipulation}main{max-width:760px;margin:auto}h1{font-size:clamp(28px,7vw,50px);margin:8px}.game{background:#181818;border:1px solid #444;border-radius:20px;padding:16px;margin-top:12px}.stats{font-size:18px;margin:8px}.screen{position:relative;width:100%;max-width:700px;margin:12px auto;background:#183d22;border:4px solid #555;border-radius:16px;overflow:hidden;aspect-ratio:16/9;touch-action:none}.world{position:absolute;inset:0;background:linear-gradient(#78c7ff 0 38%,#5fba55 38% 100%)}.ground{position:absolute;left:0;right:0;bottom:0;height:62%;background:repeating-linear-gradient(25deg,rgba(255,255,255,.06) 0 10px,transparent 10px 25px)}.tree{position:absolute;font-size:clamp(30px,8vw,55px);filter:drop-shadow(2px 3px 1px #333)}.t1{left:8%;top:47%}.t2{right:10%;top:42%}.t3{left:72%;top:70%}.rock{position:absolute;font-size:30px}.r1{left:35%;top:70%}.r2{right:30%;top:50%}.coin{position:absolute;font-size:25px}.c1{left:55%;top:35%}.c2{left:22%;top:72%}.dog{position:absolute;left:50%;top:55%;font-size:clamp(45px,10vw,75px);transform:translate(-50%,-50%);transition:transform .12s;z-index:5;user-select:none}.startOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:10}.startOverlay span{font-size:clamp(22px,5vw,38px);font-weight:bold;background:rgba(0,0,0,.7);padding:16px 22px;border-radius:16px}.action{padding:14px 22px;border:0;border-radius:14px;background:#20d866;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;margin:5px;min-height:50px}.action:disabled{opacity:.5}.jugar{background:#ffb000;color:#111}.back{background:#333}.message{min-height:25px;color:#aaa;margin:8px}.controles{margin:12px auto 4px;max-width:360px}.controles h2{font-size:19px;margin:8px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:250px;margin:auto}.pad button{min-height:58px;border:1px solid #555;border-radius:14px;background:#252525;color:white;font-size:24px;font-weight:bold;touch-action:none}.pad button:active{transform:scale(.94);background:#444}.ayuda{color:#888;font-size:13px}
</style>
</head>
<body>
<main>
<h1>🐶 SoyPerrito Adventure</h1>
<p>🎮 Juego oficial de SoyPerritoProProYT</p>
<div class="game">
<div class="stats">⭐ Puntos: <span id="puntos">0</span> | 🪙 Monedas: <span id="monedas">0</span></div>
<div class="screen" id="screen" aria-label="Pantalla del juego">
<div class="world"><div class="ground"></div><div class="tree t1">🌳</div><div class="tree t2">🌲</div><div class="tree t3">🌳</div><div class="rock r1">🪨</div><div class="rock r2">🪨</div><div class="coin c1">🪙</div><div class="coin c2">🪙</div><div class="dog" id="dog">🐶</div></div>
<div class="startOverlay" id="overlay"><span>▶️ PULSA JUGAR</span></div>
</div>
<p class="message" id="mensaje">Pulsa JUGAR para comenzar.</p>
<button class="action jugar" id="jugar" type="button">▶️ JUGAR</button>
<button class="action" id="explorar" type="button" disabled>🌳 EXPLORAR</button>
<div class="controles">
<h2>🎮 MANDO TÁCTIL</h2>
<div class="pad">
<span></span><button type="button" data-move="up" aria-label="Arriba">⬆️</button><span></span>
<button type="button" data-move="left" aria-label="Izquierda">⬅️</button><button type="button" data-move="action" aria-label="Acción">⭐</button><button type="button" data-move="right" aria-label="Derecha">➡️</button>
<span></span><button type="button" data-move="down" aria-label="Abajo">⬇️</button><span></span>
</div><p class="ayuda">Mueve al perrito por el mapa y pulsa ⭐ para explorar.</p>
</div>
<button class="action back" type="button" id="back">⬅️ VOLVER A MIS JUEGOS</button>
</div>
</main>
<script>
let puntos=0,monedas=0,jugando=false,posX=0,posY=0;
const puntosEl=document.getElementById('puntos'),monedasEl=document.getElementById('monedas'),mensaje=document.getElementById('mensaje'),explorar=document.getElementById('explorar'),jugar=document.getElementById('jugar'),dog=document.getElementById('dog'),overlay=document.getElementById('overlay');
const eventos=['🐾 Encontraste una huella misteriosa.','🦴 ¡Encontraste un hueso!','⭐ ¡Descubriste una estrella!','🌳 ¡Exploraste el bosque!','🪙 ¡Encontraste una moneda!'];
function explorarJuego(){if(!jugando)return;puntos+=10;monedas+=Math.floor(Math.random()*3)+1;puntosEl.textContent=puntos;monedasEl.textContent=monedas;mensaje.textContent=eventos[Math.floor(Math.random()*eventos.length)]+' +10 puntos';}
function mover(dir){if(!jugando){mensaje.textContent='▶️ Pulsa JUGAR primero.';return}if(dir==='up')posY=Math.max(-2.8,posY-.7);if(dir==='down')posY=Math.min(2.8,posY+.7);if(dir==='left')posX=Math.max(-6,posX-1);if(dir==='right')posX=Math.min(6,posX+1);dog.style.transform='translate(calc(-50% + '+(posX*16)+'px),calc(-50% + '+(posY*12)+'px))';mensaje.textContent='🐶 ¡Te estás moviendo por el mapa!';}
jugar.addEventListener('click',()=>{jugando=true;puntos=0;monedas=0;posX=0;posY=0;dog.style.transform='translate(-50%,-50%)';puntosEl.textContent='0';monedasEl.textContent='0';explorar.disabled=false;overlay.style.display='none';jugar.textContent='🔄 REINICIAR';mensaje.textContent='🎮 ¡Partida iniciada! Usa el mando táctil.';});
explorar.addEventListener('click',explorarJuego);
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.move;if(d==='action')explorarJuego();else mover(d)}));
document.getElementById('back').addEventListener('click',()=>{location.href='https://soyperritoyt.github.io/SoyPerritoProProYT-Console/'});
</script>
</body>
</html>
